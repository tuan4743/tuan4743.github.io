baseURL = "https://tuagfey.com/"
languageCode = "zh-cn"
title = "Tuagfey Blog"
theme = "PaperMod"
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true
pygmentsUseClasses = true
mainsections = ["posts", "tech"]
paginate = 10

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  title = "Tuagfey Blog"
  description = "Tuagfey 的个人博客 —— 记录技术、生活与思考"
  keywords = ["Blog", "Portfolio", "PaperMod", "tuagfey"]
  author = "tuan4743"
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false

  [params.assets]
    disableHLJS = true
    favicon = "/favicon.svg"

  [params.homeInfoParams]
    Title = "你好,我是 tuan4743 👋"
    Content = "欢迎来到我的博客,这里记录一些技术笔记、生活片段与思考。欢迎通过 GitHub 与我交流。"

  [[params.socialIcons]]
      name = "github"
      url = "https://github.com/tuan4743"

  [params.footer]
    ShowPoweredBy = true
    ShowCopyright = true

  [params.giscus]
    repo = "tuan4743/tuan4743.github.io"
    repoId = "R_kgDOUSNr1A"
    category = "Announcements"
    categoryId = "DIC_kwDOUSNr1M4DFJmt"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "dracula"

[[menu.main]]
  identifier = "home"
  name = "主页"
  url = "/"
  weight = 10

[[menu.main]]
  identifier = "tech"
  name = "技术"
  url = "/tech/"
  weight = 20

[[menu.main]]
  identifier = "archives"
  name = "归档"
  url = "/archives/"
  weight = 30

[[menu.main]]
  identifier = "guestbook"
  name = "留言"
  url = "/guestbook/"
  weight = 40

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 50
