{{- /* Giscus 评论组件(基于 GitHub Discussions),仅留言板页使用 */ -}}
{{- $repo := site.Params.giscus.repo | default "tuan4743/tuan4743.github.io" -}}
<hr />
<div class="giscus-wrap">
    <h2>留言</h2>
    <p>想要留言请先在 GitHub 上登录(使用你的 GitHub 账号)。</p>
    <script src="https://giscus.app/client.js"
        data-repo="{{ $repo }}"
        data-repo-id="{{ site.Params.giscus.repoId }}"
        data-category="{{ site.Params.giscus.category }}"
        data-category-id="{{ site.Params.giscus.categoryId }}"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="top"
        data-theme="preferred_color_scheme"
        data-lang="zh-CN"
        crossorigin="anonymous"
        async>
    </script>
    <script>
        /* 让 Giscus 主题跟随站点明暗切换(通过 postMessage 动态 setConfig) */
        (function () {
            var frame = null;
            function find() {
                if (!frame) frame = document.querySelector("iframe.giscus-frame");
                return frame;
            }
            function currentTheme() {
                var t = document.documentElement.dataset.theme;
                return t === "dark" ? "transparent_dark" : "light";
            }
            function send() {
                var f = find();
                if (f && f.contentWindow) {
                    f.contentWindow.postMessage(
                        { giscus: { setConfig: { theme: currentTheme() } } },
                        "https://giscus.app"
                    );
                }
            }
            var tries = 0;
            var timer = setInterval(function () {
                send();
                if (find() || ++tries > 20) clearInterval(timer);
            }, 300);
            new MutationObserver(function () { send(); })
                .observe(document.documentElement, {
                    attributes: true,
                    attributeFilter: ["data-theme", "data-palette"],
                });
        })();
    </script>
</div>
