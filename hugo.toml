  [params.intro]
    drawerLabel = "THEMES"

    [[params.intro.panels]]
      key = "self"
      title = "自我"
      tagline = "WHO AM I"
      text = "点一下飘着的 emoji,把它贴到我脸上 —— 贴满,你就认识我了。"
      # ---- CD 架文字介绍(左上:主题 + 配文 / 左下:歌名 + 歌手)----
      caption = "我思故我在"   # 主题配文(留空则用上面的 text)
      bg = "#efc243"          # CD 架背景色(跟随"当前选中的盘");文字自动取其反色 #103dbc
      song = "emomomo"
      artist = "RAS"

    # ============================================================
    # 第一张盘「自我」的主页内容:Emoji 拼贴自我介绍
    #   实现:assets/js/page-self.js + assets/css/pages.css 的 .self 段
    #   骨架:layouts/partials/pages/self.html
    #   玩法:屏幕中央一张【没有五官的空白脸】,四周像星星一样飘着 14 个 emoji;
    #         每个 emoji = 一个特质,点一下(或拖上去)就贴到脸上并蹦出一句话;
    #         全部贴满 → 脸变成那个夸张形象,并汇总出一段自我介绍。
    # ------------------------------------------------------------
    # 每条 = 一个特质,五个字段:
    #   emoji  显示在飘浮区里的那个字(原样输出,想换直接改这里)
    #   key    内部标识(JS 用;也是 data-key 与 CSS 类名,别用中文)
    #   pod    往脸上加的是哪种东西(要和 self.html 里 data-pod 对上):
    #            socket = 加一样东西(眼镜 / 耳机 / 杯子 / 手柄 / 火苗 /
    #                     星星眼 / 口罩 / 王冠 / Z / 音符 / 黑眼圈 / 红鼻子)
    #            skin   = 改整张脸本身(融化 / 半透明 / 睁不开眼)
    #          ★ skin 类【同时只会有一个生效】(两个一起上会互相打架),
    #            所以贴第二个 skin 时前一个会自动被顶掉 —— 见 page-self.js 的 place()
    #   label  贴到脸上之后,无障碍读屏用的名字
    #   text   贴上去时蹦出来的那句话
    #   alt    可选:emoji 字符与想表达的东西差太远时,给读屏用的说明
    #          (比如 🫠 是"融化的脸",我们要的是"社交电量低")
    # ★ 想再加?在这里加一段就行:飘浮位置会自动重排(见 page-self.js 的 RING),
    #   脸的部件记得同步在 self.html 里加一组 data-part="<key>" data-pod="<pod>"。
    # ============================================================
    [[params.intro.decks.self]]
      emoji = "💗"
      key = "blush"
      pod = "socket"
      label = "脸红"
      text = "嘴上说没事,心里其实很在意。"

    [[params.intro.decks.self]]
      emoji = "☕"
      key = "coffee"
      pod = "socket"
      label = "咖啡"
      text = "靠咖啡续命,晚上照样失眠。"

    [[params.intro.decks.self]]
      emoji = "💻"
      key = "code"
      pod = "socket"
      label = "代码"
      text = "写代码是工作,也是爱好。"

