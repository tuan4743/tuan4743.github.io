<div class="gd-mode" data-gd-mode data-gd-gate="easter">
    <svg class="gd-mode__frame" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path class="gd-mode__halo" d="M0 88 L1.73 91 L20 91 L20 97 L25.196 100" />
        <path class="gd-mode__line" d="M0 88 L1.73 91 L20 91 L20 97 L25.196 100" />
        <path class="gd-mode__lock" d="M0 88 h1.6 M0 88 v-1.6 M1.73 91 h1.6 M1.73 91 v-1.6 M20 91 h-1.6 M20 91 v-1.6 M20 97 h-1.6 M20 97 v1.6 M25.196 100 v-1.6 M25.196 100 h-1.6" />
        <circle class="gd-mode__node" cx="20" cy="91" r="0.35" />
        <circle class="gd-mode__node" cx="25.196" cy="100" r="0.35" />
    </svg>
    <button type="button" class="gd-mode__btn" data-gd-mode-btn aria-pressed="false">
        <span class="gd-mode__kicker">PLAY MODE</span>
        <span class="gd-mode__label">切换游玩模式</span>
        <span class="gd-mode__state" data-gd-mode-state>OFF</span>
        <span class="gd-mode__hint">开启后:插入 CD 直接进入游戏,而不是展示页</span>
    </button>
</div>

<script>
    (function () {
        var root = document.querySelector('[data-gd-mode]');
        if (!root) return;
        var btn = root.querySelector('[data-gd-mode-btn]');
        var state = root.querySelector('[data-gd-mode-state]');
        var MODE_KEY = 'tuagfey-gd-playmode';
        var EASTER_KEY = 'tuagfey-gd-easter';
        function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
        function write(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 无痕模式 */ } }

        /* 彩蛋门:默认隐藏,由 gd.js 的 unlockEaster() 写 localStorage(EASTER_KEY='1')后显示 */
        if (root.getAttribute('data-gd-gate') === 'easter' && read(EASTER_KEY) !== '1') {
            root.hidden = true;
            return;
        }

        /* ★ 这个按钮只【切换设置】:写一个标记 + 改自己的外观,不做任何别的动作
           (不插盘、不放动画、不进游戏 —— 那些是 CD 插入流程自己的事)。 */
        function paint(on) {
            root.classList.toggle('is-on', on);
            btn.setAttribute('aria-pressed', on ? 'true' : 'false');
            state.textContent = on ? 'ON' : 'OFF';
        }
        paint(read(MODE_KEY) === '1');
        btn.addEventListener('click', function (ev) {
            ev.preventDefault();
            var on = !root.classList.contains('is-on');
            paint(on);
            write(MODE_KEY, on ? '1' : '0');
            document.dispatchEvent(new CustomEvent('gd:playmode', { detail: { on: on } }));
        });
        window.__gdPlayMode = function () { return root.classList.contains('is-on'); };
    })();
</script>
