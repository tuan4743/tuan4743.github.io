baseURL = "https://tuagfey.com/"
languageCode = "zh-cn"
title = "Tuagfey Blog"
theme = "PaperMod"
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true
pygmentsUseClasses = true
mainsections = ["posts", "tech"]
paginate = 10

[minify]
  disableXML = true
  minifyOutput = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  title = "Tuagfey Blog"
  description = "Tuagfey 的个人博客 —— 记录技术、生活与思考"
  keywords = ["Blog", "Portfolio", "PaperMod", "tuagfey"]
  author = "tuan4743"
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false

  [params.assets]
    disableHLJS = true
    favicon = "/favicon.svg"

  [params.homeInfoParams]
    Title = "你好,我是 tuan4743 👋"
    Content = "欢迎来到我的博客,这里记录一些技术笔记、生活片段与思考。欢迎通过 GitHub 与我交流。"

  [[params.socialIcons]]
      name = "github"
      url = "https://github.com/tuan4743"

  [params.footer]
    ShowPoweredBy = true
    ShowCopyright = true

  [params.giscus]
    repo = "tuan4743/tuan4743.github.io"
    repoId = "R_kgDOUSNr1A"
    category = "Announcements"
    categoryId = "DIC_kwDOUSNr1M4DFJmt"

  [params.intro]
    drawerLabel = "THEMES"

    [[params.intro.panels]]
      key = "self"
      title = "自我"
      tagline = "WHO AM I"
      text = "留白:面板内容待补充"
      # ---- CD 架文字介绍(左上:主题 + 配文 / 左下:歌名 + 歌手)----
      caption = "我思故我在"   # 主题配文(留空则用上面的 text)
      bg = "#efc243"          # CD 架背景色(跟随"当前选中的盘");文字自动取其反色 #103dbc
      song = "emomomo"
      artist = "RAS"

    [[params.intro.panels]]
      key = "growth"
      title = "成长"
      tagline = "GROWING"
      text = "留白:面板内容待补充"
      caption = "永无止境"
      bg = "#a9cde8"          # 淡蓝(反色 #563217)
      song = "S.A.T.E.L.L.I.T.E"
      artist = "かめりあ"

    [[params.intro.panels]]
      key = "lost"
      title = "迷茫"
      tagline = "LOST & FOUND"
      text = "留白:面板内容待补充"
      caption = "沉溺......吗?"
      bg = "#1c56a0"          # 蓝(反色 #e3a95f)
      song = "WATER"
      artist = "A-39/初音未来"

    [[params.intro.panels]]
      key = "tech"
      title = "技术"
      tagline = "TECH"
      text = "留白:面板内容待补充"
      caption = "最高的山和最深的海"
      bg = "#000000"          # 纯黑(反色 #ffffff)
      song = "無人区 -Vacuum Track#ADD8E6"
      artist = "NoKANY"

    [[params.intro.panels]]
      key = "future"
      title = "未来"
      tagline = "FUTURE"
      text = "留白:面板内容待补充"
      caption = "终将光芒万丈"
      bg = "#ffffff"          # 纯白(反色 #000000)
      song = "The lost aria"
      artist = "Plum"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "dracula"

