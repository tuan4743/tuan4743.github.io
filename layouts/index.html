<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" dir="auto" data-theme="auto">
{{- partial "head.html" . }}
<link rel="stylesheet" href="{{ "css/intro.css" | relURL }}">
<body id="top" class="intro-page">
    <div class="intro-bg"></div>

    {{- partial "header.html" . }}

    <!-- 左侧小箭头(初始唯一可见入口,常驻不动) -->
    <button class="intro-toggle" id="intro-toggle" aria-expanded="false" aria-controls="intro-drawer"
        title="打开主题轮盘">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <polyline points="9 5 16 12 9 19"></polyline>
        </svg>
    </button>

    <!-- CD 弧形滚轮 + 光驱槽口(弹出层) -->
    <aside class="intro-drawer" id="intro-drawer" aria-hidden="true">
        <div class="tray-window" id="tray-window">
            <div class="cd-arc" id="cd-arc">
                {{- range site.Params.intro.panels }}
                <button class="cd" data-panel="{{ .key }}" aria-label="主题:{{ .title }}">
                    <span class="cd-disc">
                        <span class="cd-face">
                            <span class="cd-label">{{ .title }}</span>
                        </span>
                    </span>
                    <span class="cd-title">{{ .title }}</span>
                </button>
                {{- end }}
                <div class="cd-slot" id="cd-slot" aria-hidden="true">
                    <div class="slot-glow"></div>
                    <div class="slot-cd" id="slot-cd"></div>
                </div>
            </div>
            <p class="tray-hint" id="tray-hint">滚轮 / ↑↓ 选择 · 点击 CD 确认</p>
        </div>
    </aside>

    <!-- 主体视野(随托盘开合整体平移) -->
    <main class="intro-main" id="intro-main">
        {{- range $i, $p := site.Params.intro.panels }}
        <section class="intro-panel{{ if eq $i 0 }} is-active{{ end }}" data-panel="{{ $p.key }}">
            <div class="panel-inner">
                <span class="panel-kicker">SERIES 0{{ add $i 1 }} // {{ $p.tagline }}</span>
                <h1 class="panel-title">{{ $p.title }}</h1>
                <div class="panel-text">{{ $p.text }}</div>
            </div>
        </section>
        {{- end }}
    </main>

    <script>
        /* 首帧前恢复主题 */
        (function () {
            try {
                var t = localStorage.getItem("pref-theme");
                if (t === "dark" || t === "light") {
                    document.documentElement.dataset.theme = t;
                }
            } catch (e) {}
        })();
    </script>
    <script defer src="{{ "js/header-search.js" | relURL }}"></script>
    <script defer src="{{ "js/theme-palette.js" | relURL }}"></script>
    <script defer src="{{ "js/intro.js" | relURL }}"></script>
</body>
</html>
