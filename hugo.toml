baseURL = "https://tuagfey.com/"
languageCode = "zh-cn"
title = "Tuagfey Blog"
theme = "PaperMod"
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true
pygmentsUseClasses = true
mainsections = ["posts", "tech"]
paginate = 10

[minify]
  disableXML = true
  minifyOutput = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  title = "Tuagfey Blog"
  description = "Tuagfey 的个人博客 —— 记录技术、生活与思考"
  keywords = ["Blog", "Portfolio", "PaperMod", "tuagfey"]
  author = "tuan4743"
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false

  [params.assets]
    disableHLJS = true
    favicon = "/favicon.svg"

  [params.homeInfoParams]
    Title = "你好,我是 tuan4743 👋"
    Content = "欢迎来到我的博客,这里记录一些技术笔记、生活片段与思考。欢迎通过 GitHub 与我交流。"

  [[params.socialIcons]]
      name = "github"
      url = "https://github.com/tuan4743"

  [params.footer]
    ShowPoweredBy = true
    ShowCopyright = true

  [params.giscus]
    repo = "tuan4743/tuan4743.github.io"
    repoId = "R_kgDOUSNr1A"
    category = "Announcements"
    categoryId = "DIC_kwDOUSNr1M4DFJmt"

  [params.intro]
    drawerLabel = "THEMES"

    [[params.intro.panels]]
      key = "self"
      title = "自我"
      tagline = "WHO AM I"
      text = "留白:面板内容待补充"
      # ---- CD 架文字介绍(左上:主题 + 配文 / 左下:歌名 + 歌手)----
      caption = "我思故我在"   # 主题配文(留空则用上面的 text)
      bg = "#efc243"          # CD 架背景色(跟随"当前选中的盘");文字自动取其反色 #103dbc
      song = "emomomo"
      artist = "RAS"
    # ---- 第一张盘「自我」的主页内容:滑动分页(实现见 assets/js/page-deck.js)----
    # 每页 = 标题 + 正文 +(可选)图片;奇数页图片在右、偶数页在左,自动交替。
    # 正文里的换行会原样显示(pages.css 用了 white-space: pre-line)。
    # 图片:放进 static/assets/pages/self/,这里写 "/assets/pages/self/01.webp";
    #       image 留空 = 显示占位块(带"图片位"字样),方便先看排版。
    # 下面的文字是占位文案,直接改这里就行。
    [[params.intro.decks.self]]
      title = "我是谁"
      text = """所有的故事都从这个问题开始。

我不太会回答它,所以选择把它写下来 —— 写下来的东西,会慢慢变成答案的一部分。"""
      image = ""

    [[params.intro.decks.self]]
      title = "两面镜子"
      text = """一面是别人眼里的我,一面是我以为的我。

两张脸长得并不一样。中间的差值,大概就是需要慢慢补上的部分。"""
      image = ""

    [[params.intro.decks.self]]
      title = "把自己拆开看"
      text = """情绪、习惯、偏好 —— 原本以为理所当然的东西,拆开之后才发现各有来路。

看清来路,才知道哪些可以留着,哪些可以换掉。"""
      image = ""

    [[params.intro.decks.self]]
      title = "还没写完"
      text = """这份自我认知不会有"完成"的那一天。

它更像一个持续更新的页面:过一段时间回来看,总会觉得上一版有点陌生。"""
      image = ""

    # ---- 第二张盘「成长」的主页内容:科幻风太阳系行星图 ----
    # 恒星(屏幕最左那颗)的标题 / 副标题
    [params.intro.solar]
      # 素材都在 static/planet/(贴图已自动裁掉透明边距并转成 WebP)
      bg = "/planet/bg.jpg"            # 宇宙背景(1440×715,正好是可视窗比例)
      bg_dim = 0.45                    # 背景暗化:0 = 原样,1 = 全黑(只看暗化遮罩)
      sun = "/planet/sun.mp4"         # 蓝巨星
      sun_x = 0.28                     # 恒星中心 x(面板宽的比例)
      sun_y = 0.28                    # 恒星中心 y
      sun_w = 0.26                     # 恒星宽度占面板宽的比例(想更大就调这里)
      sun_depth = 0.02                 # 恒星纵深:极小 → 转视角时只轻微动一点点
      # sun 也可以直接填视频(放在 static/planet/,例如 "/planet/sun.mp4"),
      # 会自动用 <video muted autoplay loop playsinline> 播放 —— 不会导入声音
      depth = 0.05

    # 五颗行星【从左到右】:寒冷 → 炎热 → 类地 → 黑洞 → 气态
    # x / y = 星体中心(面板宽高的比例);w = 宽度占面板宽的比例;rot = 贴图旋转(度)
    # 向阳面统一朝左上,所以五颗都排在恒星的右下方;个别对不上就用 rot 转一下
    # 精调:浏览器打开 https://tuagfey.com/?tune,拖滑条 → 复制 TOML
    [[params.intro.panels]]
      key = "growth"
      title = "成长"
      tagline = "GROWING"
      text = "留白:面板内容待补充"
      caption = "永无止境"
      bg = "#a9cde8"          # 淡蓝(反色 #563217)
      song = "S.A.T.E.L.L.I.T.E"
      artist = "かめりあ"

    # 五颗行星【从左到右】:寒冷 → 炎热 → 类地 → 黑洞 → 气态
    # x / y = 星体中心(面板宽高的比例);w = 宽度占面板宽的比例;rot = 贴图旋转(度)
    # 向阳面统一朝左上,所以五颗都排在恒星的右下方;个别对不上用 rot 转一下
    # 精调:打开 https://tuagfey.com/?tune 拖滑条 → 复制 TOML 贴回这里
    [[params.intro.decks.growth]]
      code = "SS-01"
      kind = "cold"
      title = "寒冷行星"
      text = "整颗星球都在冰点以下,连风都是硬的。它在最外侧,离光最远,也最安静。"
      tex = "/planet/cold.webp"
      x = 0.05
      y = 0.62
      w = 0.06
      depth = 3.0

    [[params.intro.decks.growth]]
      code = "SS-02"
      kind = "hot"
      title = "炎热行星"
      text = "地表被烤成锈红色,大气薄得留不住热。太靠近光的地方,往往长不出柔软的东西。"
      tex = "/planet/hot.webp"
      x = 0.1
      y = 0.86
      w = 0.02
      depth = 0.2

    [[params.intro.decks.growth]]
      code = "SS-03"
      kind = "terrestrial"
      title = "类地行星"
      text = "有海、有云、有大气层。岩石上那道巨大的裂痕是很久以前留下的,现在长满了安静。"
      tex = "/planet/earth.webp"
      x = 0.56
      y = 0.70
      w = 0.04
      depth = 0.5

    [[params.intro.decks.growth]]
      code = "SS-04"
      kind = "blackhole"
      title = "黑洞"
      text = "不发光,只能靠被它拉弯的光看见。最小、最重,也最难绕开 —— 有些东西是这样被认出来的。"
      tex = "/planet/blackhole.webp"
      x = 0.68
      y = 0.14
      w = 0.02
      depth = 0.1

    [[params.intro.decks.growth]]
      code = "SS-05"
      kind = "gas"
      title = "气态巨行星"
      text = "没有地面可以落脚,只有一层比一层重的风。它很大,大到能替内圈挡下大部分撞击。"
      tex = "/planet/gas.webp"
      x = 0.85
      y = 0.68
      w = 0.16
      depth = 1.5
    [[params.intro.panels]]
      key = "lost"
      title = "迷茫"
      tagline = "LOST & FOUND"
      text = "留白:面板内容待补充"
      caption = "沉溺......吗?"
      bg = "#1c56a0"          # 蓝(反色 #e3a95f)
      song = "WATER"
      artist = "A-39/初音未来"

    [[params.intro.panels]]
      key = "tech"
      title = "技术"
      tagline = "TECH"
      text = "留白:面板内容待补充"
      caption = "最高的山和最深的海"
      bg = "#000000"          # 纯黑(反色 #ffffff)
      song = "無人区 -Vacuum Track#ADD8E6"
      artist = "NoKANY"

    [[params.intro.panels]]
      key = "future"
      title = "未来"
      tagline = "FUTURE"
      text = "留白:面板内容待补充"
      caption = "终将光芒万丈"
      bg = "#ffffff"          # 纯白(菱形自动取白);这张的反色是黑,压在深底上会看不见,
      fg = "#dceeff"          # 所以单独指定成浅蓝(文字/按钮/音频条都用它)。
      # 注:菱形是"白色 50% 叠深底"=浅灰,所以浅蓝要够亮才能同时压得住浅灰和深底;
      # 太中间的蓝(比如 #9dd2ff)在浅灰菱形上只有 2.3:1,会糊
      song = "The lost aria"
      artist = "Plum"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "dracula"

