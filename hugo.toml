baseURL = "https://tuagfey.com/"
languageCode = "zh-cn"
title = "Tuagfey Blog"
theme = "PaperMod"
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true
pygmentsUseClasses = true
mainsections = ["posts", "tech"]
paginate = 10

[minify]
  disableXML = true
  minifyOutput = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
  # ★ 每个页面额外生成一份 markdown(public/<页面路径>/index.md)。
  #   用途:右侧 HUD 上那枚"导出 Markdown"按钮 —— 点下去直接下载原文,
  #   而不是前端拿 DOM 拼字符串。
  #   · page(普通文章)→ layouts/_default/single.md = 源文件原文(带 front matter)
  #   · 列表页(section/taxonomy/term)→ layouts/_default/list.md = 这一页的条目清单
  #   ★ 列表页也必须给:否则 /tech/ 这类页面上那枚按钮就成了死链(实测 404),
  #     而用户在页面上看到的只是"怎么少了一个按钮"。
  page = ["HTML", "markdown"]
  section = ["HTML", "RSS", "markdown"]
  taxonomy = ["HTML", "RSS", "markdown"]
  term = ["HTML", "RSS", "markdown"]

[mediaTypes]
  [mediaTypes."text/markdown"]
    suffixes = ["md"]

[outputFormats.markdown]
  mediaType = "text/markdown"
  baseName = "index"
  isPlainText = true
  isHTML = false

[params]
  env = "production"
  title = "Tuagfey Blog"
  # ★ 左下角 UHD 里"音乐"那枚按钮投出来的播放器:网易云的嵌入式地址(留空则用下面的歌单)。
  #   单曲:  hudMusicEmbed = "//music.163.com/outchain/player?type=2&id=歌曲ID&auto=0&height=66"
  #   (auto=1 是打开页面就自动播 —— 一般留给用户自己点,所以填 0。)
  hudMusicEmbed = ""
  # ★★ 歌单(用户给的 25 个 ID)。name / count 是 2026-09-29 用公开接口抓的一次快照,
  #    只为了让面板里认得出是哪个;歌单改名了不用管,想刷新重抓一遍就是。
  #    count = 0 的多半是"我喜欢的音乐"这类需要登录的歌单 ⇒ 面板里照样列出来,
  #    但播放器可能是空的(网易云的嵌入式播放器读不到别人的私密歌单)。
  #    ★ 另外 9 个 ID 接口直接返回 404(歌单被删或转私密了),先注释在最下面 ——
  #      你确认还在的话把它们取消注释就能用。
  hudMusicPlaylists = [
    { id = "2031005346", name = "我喜欢的音乐", count = 0 },
    { id = "36664350", name = "矮油", count = 51 },
    { id = "26281760", name = "我喜欢的音乐", count = 0 },
    { id = "2013900062", name = "纯音乐", count = 2 },
    { id = "2075035816", name = "↣", count = 13 },
    { id = "2082329069", name = "周晓武1901喜欢的音乐", count = 245 },
    { id = "2088128876", name = "每日歌曲推荐(2018.02.05)", count = 27 },
    { id = "2739720981", name = "我喜欢的音乐", count = 0 },
    { id = "2718590745", name = "苦行僧傅彧喜欢的音乐", count = 2 },
    { id = "2609393672", name = "伤感情歌", count = 19 },
    { id = "2693307042", name = "我喜欢的音乐", count = 0 },
    { id = "509531185", name = "我喜欢的音乐", count = 0 },
    { id = "29389381", name = "Xcica喜欢的音乐", count = 1 },
    { id = "5223391377", name = "反方向的钟", count = 629 },
    { id = "27646687", name = "我喜欢的音乐", count = 1 },
    { id = "450222764", name = "我喜欢的音乐", count = 0 },
    # ★ 这 9 个 ID 公开接口 404(歌单没了或转私密),先留着不启用:
    # { id = "1424155127" },
    # { id = "3394036706" },
    # { id = "3342981041" },
    # { id = "3374216186" },
    # { id = "3365242576" },
    # { id = "3402170281" },
    # { id = "2625426770" },
    # { id = "1944896413" },
