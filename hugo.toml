    # ---- 第二张盘「成长」的主页内容:科幻风太阳系行星图 ----
    # 恒星(屏幕最左那颗)的标题 / 副标题
    [params.intro.solar]
      # 素材都在 static/planet/(贴图已自动裁掉透明边距并转成 WebP)
      bg = "/planet/bg.jpg"            # 宇宙背景(1440×715,正好是可视窗比例)
      bg_dim = 0.65                    # 背景暗化:0 = 原样,1 = 全黑(只看暗化遮罩)
      sun = "/planet/sun.mp4"         # 蓝巨星
      sun_x = 0.3                     # 恒星中心 x(面板宽的比例)
      sun_y = 0.22                    # 恒星中心 y
      sun_w = 0.1                     # 恒星宽度占面板宽的比例(想更大就调这里)
      sun_depth = 0.002                 # 恒星纵深:极小 → 转视角时只轻微动一点点
      sun_sphere = 0.48                # 视频里球体占画面宽的比例(实测 sun.mp4 = 0.52)
                                       # 用视频时,元素会按 1/这个值 放大,所以 sun_w 仍是"球体宽度"
      # 恒星自己的 HUD 卡片:和五颗行星同一套样式、同一套避边框规则。
      # 鼠标移到恒星上(或触屏点一下)才出现;太阳本体一个像素都不动
      sun_code = "SS-00"
      sun_title = "蓝巨星"
      sun_text = "整张星图里唯一自己在发光的东西。其余五颗都只是反光 —— 成长大概就是从这里开始的。"
      # sun 也可以直接填视频(放在 static/planet/,例如 "/planet/sun.mp4"),
      # 会自动用 <video muted autoplay loop playsinline> 播放 —— 不会导入声音

    # 五颗行星【从左到右】:寒冷 → 炎热 → 类地 → 黑洞 → 气态
    # x / y = 星体中心(面板宽高的比例);w = 宽度占面板宽的比例;rot = 贴图旋转(度)
    # 向阳面统一朝左上,所以五颗都排在恒星的右下方;个别对不上就用 rot 转一下
    # 精调:浏览器打开 https://tuagfey.com/?tune,拖滑条 → 复制 TOML
    [[params.intro.panels]]
      key = "growth"
      title = "成长"
      tagline = "GROWING"
      text = "留白:面板内容待补充"
      caption = "永无止境"
      bg = "#a9cde8"          # 淡蓝(反色 #563217)
      song = "S.A.T.E.L.L.I.T.E"
      artist = "かめりあ"

    # 五颗行星【从左到右】:寒冷 → 炎热 → 类地 → 黑洞 → 气态
    # x / y = 星体中心(面板宽高的比例);w = 宽度占面板宽的比例;rot = 贴图旋转(度)
    # 向阳面统一朝左上,所以五颗都排在恒星的右下方;个别对不上用 rot 转一下
    # 精调:打开 https://tuagfey.com/?tune 拖滑条 → 复制 TOML 贴回这里
    [[params.intro.decks.growth]]
      code = "SS-01"
      kind = "cold"
      title = "寒冷行星"
      text = "整颗星球都在冰点以下,连风都是硬的。它在最外侧,离光最远,也最安静。"
      tex = "/planet/cold.webp"
      x = 0.05
      y = 0.82
      w = 0.06
      depth = 3.0

    [[params.intro.decks.growth]]
      code = "SS-02"
      kind = "hot"
      title = "炎热行星"
      text = "地表被烤成锈红色,大气薄得留不住热。太靠近光的地方,往往长不出柔软的东西。"
      tex = "/planet/hot.webp"
      x = 0.2
      y = 0.56
      w = 0.02
      depth = 0.2

    [[params.intro.decks.growth]]
      code = "SS-03"
      kind = "terrestrial"
      title = "类地行星"
      text = "有海、有云、有大气层。岩石上那道巨大的裂痕是很久以前留下的,现在长满了安静。"
      tex = "/planet/earth.webp"
      x = 0.56
      y = 0.70
      w = 0.04
      depth = 0.5

    [[params.intro.decks.growth]]
      code = "SS-04"
      kind = "blackhole"
      title = "黑洞"
      text = "不发光,只能靠被它拉弯的光看见。最小、最重,也最难绕开 —— 有些东西是这样被认出来的。"
      tex = "/planet/blackhole.webp"
      x = 0.68
      y = 0.14
      w = 0.02
      depth = 0.1

    [[params.intro.decks.growth]]
      code = "SS-05"
      kind = "gas"
      title = "气态巨行星"
      text = "没有地面可以落脚,只有一层比一层重的风。它很大,大到能替内圈挡下大部分撞击。"
      tex = "/planet/gas.webp"
      x = 0.85
      y = 0.68
      w = 0.16
      depth = 1.5
    [[params.intro.panels]]
      key = "lost"
      title = "迷茫"
      tagline = "LOST & FOUND"
      text = "留白:面板内容待补充"
      caption = "沉溺......吗?"
      bg = "#1c56a0"          # 蓝(反色 #e3a95f)
      song = "WATER"
      artist = "A-39/初音未来"

    # ---- 第三张盘「迷茫」的主页内容:迷你平台跳跃(死一次,长一样本事) ----
    # 关卡结构在 assets/js/page-lost.js 顶部的 LV 里(每段过不去 → 必死 → 解锁一样能力)
    # 这里只管文案:开场白 / 四样能力的名字与解锁台词 / 终点那句话
    [params.intro.lost]
      code = "LV-00 // ENDLESS CORRIDOR"      # 左上角那行小字
      intro = "他站在起点。前面很长,他还不知道自己缺什么。"
      # 开场先说一句,然后每解锁一样能力说一句(ability 要和下面的 items 对上)
      # 台词都是第三人称「他」——这一张盘的旁白视角
      ending = "尽头没有答案。他只是走了很久,然后站到了这里 —— 这样也已经够了。"
      goal = "终点"
      restart = "按 R 再来一次"

    # 四段 = 四个存档点(几何冲刺式音乐关卡:「他过不去的地方,就是他缺的东西」)
    # t/mode 在 static/assets/cd/lost-chart.json 里(铺面数据),这里只管"字":
    #   theme 主题 / title 变形 / text 能力说明 / line 那段的旁白(第三人称「他」)
    # ability 是内部名字(JS 用,要和铺面里的 ability 对上),不要改
    [[params.intro.decks.lost]]
      code = "ST-01"
      ability = "echo"
      theme = "复盘"
      key = "TAP ×2"
      title = "二段跳"
      text = "空中再点一次,可以再蹬一下。死了会在那一拍留个残影,下一轮那一拍自动替你蹬。"
      line = "他掉下去过很多次。第四次,他在半空里又蹬了一下 —— 原来脚下不一定非要有东西。"

    [[params.intro.decks.lost]]
      code = "ST-02"
      ability = "plane"
      theme = "求助"
      key = "按住 / 松开"
      title = "飞机"
      text = "按住就往上升,松开就往下走 —— 两边都是 45°。"
      line = "有人告诉他别硬扛。他试着把身体放平,顺着风斜着走 —— 原来路可以是斜的。"

    [[params.intro.decks.lost]]
      code = "ST-03"
      ability = "shield"
      theme = "呼吸"
      key = "S / 盾"
      title = "护盾形态"
      text = "点击获得一层护盾:2 秒内撞什么都没事,冷却 5 秒。"
      line = "他学会了停下来吸气。有些疼是可以挡在外面的,只要他先承认自己在怕。"

    [[params.intro.decks.lost]]
      code = "ST-04"
      ability = "gravity"
      theme = "继续"
      key = "拍点上 TAP"
      title = "重力箭头"
      text = "在箭头那一拍点击,重力翻过来 —— 上下两条轨道随你换。"
      line = "上下的区别忽然不重要了。他不再问该往哪走,只管接着走。"
    [[params.intro.panels]]
      key = "tech"
      title = "技术"
      tagline = "TECH"
      text = "留白:面板内容待补充"
      caption = "最高的山和最深的海"
      bg = "#000000"          # 纯黑(反色 #ffffff)
      song = "無人区 -Vacuum Track#ADD8E6"
      artist = "NoKANY"

    # ---- 第四张盘「技术」的主页内容:故障光盘 = 一台紧急恢复终端 ----
    # 这张盘没有分页:整页就是一块终端(layouts/partials/pages/tech.html)
    # 下面这条只是"让 tech 走自定义页面"的开关(有 decks.tech 才会渲染那个 partial)。
    # 终端里的文字/文件树/项目简介都在 assets/js/cd4-terminal.js +
    # static/assets/cd/tech/(盘里的真实文件),这里不用重复写。
    [[params.intro.decks.tech]]
      code = "CD-04"
      key = "emergency"
      title = "紧急恢复终端"
      text = "故障光盘:只读挂载 + 坏扇区,用 recover 把项目从盘里救出来。"

    [[params.intro.panels]]
      key = "future"
      title = "未来"
      tagline = "FUTURE"
      text = "窗上结了霜。暖一暖,底下写着几句话。"
      caption = "终将光芒万丈"
      # 收尾宣言:碎片全部收齐后浮在屏幕中央的那一段(见 pages/future.html)
      declaration = "霜不会一次化完,路也不会一次看清。你只要走到下一盏灯。"
      bg = "#ffffff"          # 纯白(菱形自动取白);这张的反色是黑,压在深底上会看不见,
      fg = "#dceeff"          # 所以单独指定成浅蓝(文字/按钮/音频条都用它)。
      # 注:菱形是"白色 50% 叠深底"=浅灰,所以浅蓝要够亮才能同时压得住浅灰和深底;
      # 太中间的蓝(比如 #9dd2ff)在浅灰菱形上只有 2.3:1,会糊
      song = "The lost aria"
      artist = "Plum"

    # ============================================================
    # 第五张盘「未来」的主页内容:夜窗 · 极光 · 记忆碎片
    #   实现:assets/js/page-frost.js + layouts/partials/pages/future.html
    #   玩法(方案由用户给):
    #     窗上结满霜 → 鼠标/手指靠近的地方被"暖"化,化成水滴滑下来 →
    #     霜底下浮出半透明的记忆碎片 → 点开一片,它飞到屏幕中央放大、显出文字 →
    #     收下的碎片变成夜空里的一颗星 → 同主题的星星连成一个星座 →
    #     全部收齐:中央浮出未来宣言,窗外亮起极光。
    # ------------------------------------------------------------
    # 每条 = 一片碎片(一句"写给未来的话")。字段:
    #   text   写给未来的话(显示在碎片上;也是真 DOM 文本,可选中 / 可读屏)
    #   theme  星座分组名。同名的一起连成一个星座。
    #          ★ 留 3 条【不写 theme】的 —— 用户要求"保留几颗单独的,
    #            不然整体全是星座反而不好看"。
    #   位置与形状(不规则多边形)由 JS 按面板尺寸算,这里不用写坐标;
    #   加一句删一句都不用调布局。
    # ★ 写作口径(用户这一版重新定的):"写给未来的自己 / 我对未来的愿景"。
    #   —— 和上一版(回头看剩下什么)正好相反:这一版是【向前看】的。
    #   长度按"碎片上一次读完"来控,不超过一行半。
    # ============================================================
    [[params.intro.decks.future]]
      text = "愿未来的你,依然对世界好奇。"
      theme = "好奇"

    [[params.intro.decks.future]]
      text = "愿你还会为一件与你无关的事停下来。"
      theme = "好奇"

    [[params.intro.decks.future]]
      text = "愿你还肯为「不知道」多花一点时间。"
      theme = "好奇"

    [[params.intro.decks.future]]
      text = "未来,我想写出改变世界的一小段代码。"
      theme = "创造"

    [[params.intro.decks.future]]
      text = "愿你把想做的事做完一次,而不是开始很多次。"
      theme = "创造"

    [[params.intro.decks.future]]
      text = "愿你做出来的东西,真的有人用上了。"
      theme = "创造"

    [[params.intro.decks.future]]
      text = "希望能在某个雪夜,读完一本厚厚的书。"
      theme = "生活"

    [[params.intro.decks.future]]
      text = "愿你有几个朋友,不用解释也懂。"
      theme = "生活"

    [[params.intro.decks.future]]
      text = "愿你身边的那个人,一直还在。"
      theme = "生活"

    [[params.intro.decks.future]]
      text = "愿你偶尔想起今天这个晚上。"

    [[params.intro.decks.future]]
      text = "愿你没变成自己讨厌的那种人。"

    [[params.intro.decks.future]]
      text = "愿你还敢说「我想要」。"

