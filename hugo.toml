      key = "mask"
      pod = "socket"
      label = "口罩"
      text = "社交场合戴着脸,回家才摘。"

    [[params.intro.decks.self]]
      emoji = "👑"
      key = "crown"
      pod = "socket"
      label = "王冠"
      text = "嘴上说随便,心里早有答案。"

    [[params.intro.decks.self]]
