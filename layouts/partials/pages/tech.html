<div class="term is-unstable" id="cd4-term" data-term="{{ .key }}" data-term-cd="/assets/cd/tech">
    <div class="term-stage">
        <pre class="term-screen" id="cd4-screen" tabindex="0" role="log" aria-live="off"
            aria-label="Emergency recovery terminal: type 'help' for available commands"></pre>
        <div class="term-tear" id="cd4-tear" aria-hidden="true"></div>
        <div class="term-scan" aria-hidden="true"></div>
    </div>
    <div class="term-sr" id="cd4-live" aria-live="polite"></div>
</div>

{{- with resources.Get "js/cd4-terminal.js" -}}
{{- $js := . | fingerprint "sha256" -}}
<script defer src="{{ $js.RelPermalink }}"></script>
{{- else -}}
{{- warnf "缺少 assets/js/cd4-terminal.js —— 第四张盘的终端不会启动" -}}
{{- end -}}
