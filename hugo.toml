baseURL = "https://tuagfey.com/"
languageCode = "zh-cn"
title = "Tuagfey Blog"
theme = "PaperMod"
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true
pygmentsUseClasses = true
mainsections = ["posts", "tech"]
paginate = 10

[minify]
  disableXML = true
  minifyOutput = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  title = "Tuagfey Blog"
  description = "Tuagfey 的个人博客 —— 记录技术、生活与思考"
  keywords = ["Blog", "Portfolio", "PaperMod", "tuagfey"]
  author = "tuan4743"
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false

  [params.assets]
    disableHLJS = true
    favicon = "/favicon.svg"

  [params.homeInfoParams]
    Title = "你好,我是 tuan4743 👋"
    Content = "欢迎来到我的博客,这里记录一些技术笔记、生活片段与思考。欢迎通过 GitHub 与我交流。"

  [[params.socialIcons]]
      name = "github"
      url = "https://github.com/tuan4743"

  [params.footer]
    ShowPoweredBy = true
    ShowCopyright = true

  [params.giscus]
    repo = "tuan4743/tuan4743.github.io"
    repoId = "R_kgDOUSNr1A"
    category = "Announcements"
    categoryId = "DIC_kwDOUSNr1M4DFJmt"

  [params.intro]
    drawerLabel = "THEMES"

    [[params.intro.panels]]
      key = "self"
      title = "自我"
      tagline = "WHO AM I"
      text = "留白:面板内容待补充"
      # ---- CD 架文字介绍(左上:主题 + 配文 / 左下:歌名 + 歌手)----
      caption = "我思故我在"   # 主题配文(留空则用上面的 text)
      bg = "#efc243"          # CD 架背景色(跟随"当前选中的盘");文字自动取其反色 #103dbc
      song = "emomomo"
      artist = "RAS"
    # ---- 第一张盘「自我」的主页内容:滑动分页(实现见 assets/js/page-deck.js)----
    # 每页 = 标题 + 正文 +(可选)图片;奇数页图片在右、偶数页在左,自动交替。
    # 正文里的换行会原样显示(pages.css 用了 white-space: pre-line)。
    # 图片:放进 static/assets/pages/self/,这里写 "/assets/pages/self/01.webp";
    #       image 留空 = 显示占位块(带"图片位"字样),方便先看排版。
    # 下面的文字是占位文案,直接改这里就行。
    [[params.intro.decks.self]]
      title = "我是谁"
      text = """所有的故事都从这个问题开始。

我不太会回答它,所以选择把它写下来 —— 写下来的东西,会慢慢变成答案的一部分。"""
      image = ""

    [[params.intro.decks.self]]
      title = "两面镜子"
      text = """一面是别人眼里的我,一面是我以为的我。

两张脸长得并不一样。中间的差值,大概就是需要慢慢补上的部分。"""
      image = ""

    [[params.intro.decks.self]]
      title = "把自己拆开看"
      text = """情绪、习惯、偏好 —— 原本以为理所当然的东西,拆开之后才发现各有来路。

看清来路,才知道哪些可以留着,哪些可以换掉。"""
      image = ""

    [[params.intro.decks.self]]
      title = "还没写完"
      text = """这份自我认知不会有"完成"的那一天。

它更像一个持续更新的页面:过一段时间回来看,总会觉得上一版有点陌生。"""
      image = ""

    [[params.intro.panels]]
      key = "growth"
      title = "成长"
      tagline = "GROWING"
      text = "留白:面板内容待补充"
      caption = "永无止境"
      bg = "#a9cde8"          # 淡蓝(反色 #563217)
      song = "S.A.T.E.L.L.I.T.E"
      artist = "かめりあ"

    [[params.intro.panels]]
      key = "lost"
      title = "迷茫"
      tagline = "LOST & FOUND"
      text = "留白:面板内容待补充"
      caption = "沉溺......吗?"
      bg = "#1c56a0"          # 蓝(反色 #e3a95f)
      song = "WATER"
      artist = "A-39/初音未来"

    [[params.intro.panels]]
      key = "tech"
      title = "技术"
      tagline = "TECH"
      text = "留白:面板内容待补充"
      caption = "最高的山和最深的海"
      bg = "#000000"          # 纯黑(反色 #ffffff)
      song = "無人区 -Vacuum Track#ADD8E6"
      artist = "NoKANY"

    [[params.intro.panels]]
      key = "future"
      title = "未来"
      tagline = "FUTURE"
      text = "留白:面板内容待补充"
      caption = "终将光芒万丈"
      bg = "#ffffff"          # 纯白(菱形自动取白);这张的反色是黑,压在深底上会看不见,
      fg = "#dceeff"          # 所以单独指定成浅蓝(文字/按钮/音频条都用它)。
      # 注:菱形是"白色 50% 叠深底"=浅灰,所以浅蓝要够亮才能同时压得住浅灰和深底;
      # 太中间的蓝(比如 #9dd2ff)在浅灰菱形上只有 2.3:1,会糊
      song = "The lost aria"
      artist = "Plum"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "dracula"

